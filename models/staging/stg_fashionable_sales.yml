version: 2

models:
  - name: stg_fashionable_sales
    description: >
      Typed, renamed staging model over raw_sales, with an explicit
      cleaning step (trimming, upper-casing ship_city/ship_state/
      ship_country to fix observed casing inconsistencies, e.g.
      'MUMBAI' vs 'Bengaluru' vs 'Hyderabad' for what may be the same real
      city) and an exact-duplicate row guard.
      Grain: one row per order line (order_id + sku).
    columns:
      - name: source_row_index
        description: "Original CSV row index. Not a business key."

      - name: order_id
        description: "Order identifier. NOT unique alone - order_id+sku test added."
        tests:
          - not_null

      - name: sku
        description: "Product SKU for this order line."
        tests:
          - not_null

      - name: order_date
        description: "Order date, cast from the raw MM-DD-YY string."
        tests:
          - not_null

      - name: order_status
        description: "Order status."
        tests:
          - not_null

      - name: quantity
        description: "Quantity on this order line. Observed 0 for cancelled orders."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
             arguments:
               min_value: 0
               config:
                 severity: warn

      - name: amount
        description: "Order line amount. NULL for cancelled/zero-qty lines by source but changed to 0."
        

      - name: currency_code
        description: "Currency code. Sample data observed only 'INR' - flagging as unconfirmed for the full dataset."
        tests:
          - accepted_values:
              values: ['INR']
              config:
                severity: warn

    tests:
      # Composite natural key check: confirms the order-line grain decision.
      # If this fails, (order_id, sku) is not actually unique and the fact table surrogate key needs an additional tiebreaker column.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - sku
            - asin
            - courier_status
